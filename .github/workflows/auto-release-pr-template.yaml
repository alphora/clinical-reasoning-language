name: Auto-select PR Template

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  set-pr-template:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set release PR body from external template
        if: startsWith(github.head_ref, 'release/')
        uses: actions/github-script@v7
        with:
          script: |
            require('./.github/scripts/set-release-pr-body.js')
