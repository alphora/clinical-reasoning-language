# The repository's ONE test gate. It runs on every push to a long-lived branch, on pull requests into them, and on release
# publication — where a failure also stops the npm publish that `needs:` it.
#
# ⚠ IT MUST FIRE ON `push`. It previously ran only on `pull_request` into main and on `release`, while the work goes
# straight to `develop` — so the gate went months without executing and two tests rotted undetected. Both then surfaced for
# the first time as a FAILED RELEASE. A gate that only fires when you are trying to ship is not a gate; it is an ambush.
name: CI and Release Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]
  workflow_dispatch:

# Supersede in-flight runs for the same branch, since every push now starts one. Release and PR runs are never cancelled:
# a cancelled release run would skip `publish-npm`, which `needs:` it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test-release:
    name: Run Tests Before Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the change-detector can diff against the PR base. Cheap for this repo.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Path-scoped test selection. The dependency is ASYMMETRIC: crl-vscode imports the BUILT @smile-digital-health/crl,
      # so any packages/crl/** change can break the extension (→ run BOTH), but a packages/crl-vscode/**-only change cannot
      # affect core (→ run the extension only, skip core). Anything else (root config, lockfile, .github, docs) defaults to
      # BOTH — an unclassified path must never skip both and go falsely green. On push/release/workflow_dispatch there is no
      # PR base to diff, so both always run — deliberately, because a push to a long-lived branch is the last gate before a
      # release and is the wrong place to be clever about skipping. Any error in detection falls back to running BOTH (fail-safe). Kept as step-level
      # `if:` inside this ONE job (not split into separate jobs) so the required-check name `test-release` is unchanged and
      # a skipped step never sits as a never-reported required check on the protected branch.
      - name: Detect changed packages
        id: changes
        run: |
          set -euo pipefail
          run_core=true
          run_ext=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref }}"
            # Fetch the base into refs/remotes/origin/<base> explicitly (a bare `git fetch origin <ref>` may only land in
            # FETCH_HEAD depending on config), so the three-dot merge-base diff below resolves.
            if git fetch --no-tags origin "$base_ref:refs/remotes/origin/$base_ref" \
               && files=$(git diff --name-only "origin/$base_ref...HEAD"); then
              echo "Changed files:"; echo "$files"
              # An empty (but successful) diff must NOT skip both — fall back to BOTH (run_core/run_ext keep their `true`).
              if [ -z "$files" ]; then
                echo "empty diff — defaulting to running BOTH (fail-safe)"
              else
                core=false; ext=false; shared=false
                while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  case "$f" in
                    packages/crl/*) core=true ;;
                    packages/crl-vscode/*) ext=true ;;
                    *) shared=true ;;
                  esac
                done <<< "$files"
                # skip core ONLY when the change set is exclusively under packages/crl-vscode/**
                if [ "$core" = true ] || [ "$shared" = true ]; then run_core=true; else run_core=false; fi
                # run the extension when core changed (dep), the extension changed, or anything shared changed
                if [ "$core" = true ] || [ "$ext" = true ] || [ "$shared" = true ]; then run_ext=true; else run_ext=false; fi
              fi
            else
              echo "diff failed — defaulting to running BOTH (fail-safe)"
            fi
          else
            echo "event=${{ github.event_name }} (not a PR) — running BOTH"
          fi
          # Universal safety net: the invariant is "never skip BOTH". If classification ever narrows to nothing, run both.
          if [ "$run_core" = false ] && [ "$run_ext" = false ]; then run_core=true; run_ext=true; fi
          echo "run_core=$run_core" >> "$GITHUB_OUTPUT"
          echo "run_ext=$run_ext" >> "$GITHUB_OUTPUT"
          echo "→ run_core=$run_core  run_ext=$run_ext"

      - name: Install dependencies (workspaces)
        run: npm install

      # Always build core: the extension depends on it, and skipping it would only save seconds.
      - name: Build core
        run: npm run build -w @smile-digital-health/crl

      - name: Test core
        if: steps.changes.outputs.run_core == 'true'
        run: npm test -w @smile-digital-health/crl

      # The MCP integration test spawns the BUILT dist/cli/run-mcp-server.js. It is now part of core's `npm test`, but stays
      # wired explicitly here too: it is the ONLY test that drives the real MCP server over the protocol — what the KE
      # actually touches — and it spent a long time orphaned from CI. Invoked directly rather than via `npm run test:mcp`
      # so its `pretest:mcp` does not rebuild core, already done by "Build core" above.
      - name: Test core — MCP integration
        if: steps.changes.outputs.run_core == 'true'
        run: node packages/crl/src/cli/tests/run-mcp-server.test.mjs

      - name: Test extension
        if: steps.changes.outputs.run_ext == 'true'
        run: npm test -w crl-language-support

  publish-npm:
    name: Publish core (@smile-digital-health/crl) to npm
    runs-on: ubuntu-latest
    needs: test-release
    permissions:
      contents: read
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft && !github.event.release.prerelease
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      # REFACTOR:grounded: publish the installed-qualified archive attached to this release.
      - name: Download and verify qualified core archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/crl/package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || { echo "Release tag $RELEASE_TAG does not match v$VERSION"; exit 1; }
          SDK_ASSET="smile-digital-health-crl-$VERSION.tgz"
          SDK_DIR="$RUNNER_TEMP/crl-qualified-npm"
          mkdir -p "$SDK_DIR"
          downloaded=false
          for attempt in 1 2 3 4 5; do
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$SDK_ASSET" --pattern SHA256SUMS --dir "$SDK_DIR" --clobber \
              && [ -f "$SDK_DIR/$SDK_ASSET" ] && [ -f "$SDK_DIR/SHA256SUMS" ]; then
              downloaded=true
              break
            fi
            echo "Release assets unavailable on attempt $attempt of 5"
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          test "$downloaded" = true || { echo "Qualified release assets could not be downloaded"; exit 1; }
          node --input-type=module - "$SDK_DIR" "$SDK_ASSET" "$VERSION" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const [directory, asset, version] = process.argv.slice(2);
          const entries = readFileSync(join(directory, 'SHA256SUMS'), 'utf8').split(/\r?\n/)
            .map(line => /^([0-9a-f]{64}) [ *](.+)$/.exec(line)).filter(entry => entry?.[2] === asset);
          assert.equal(entries.length, 1, 'Exactly one checksum must identify the qualified archive');
          const archive = join(directory, asset);
          assert.equal(createHash('sha256').update(readFileSync(archive)).digest('hex'), entries[0][1], 'Archive SHA-256');
          const manifest = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], { encoding: 'utf8' }));
          assert.equal(manifest.name, '@smile-digital-health/crl', 'Qualified package name');
          assert.equal(manifest.version, version, 'Qualified package version');
          const taggedManifest = JSON.parse(readFileSync('packages/crl/package.json', 'utf8'));
          for (const field of ['main', 'bin', 'exports', 'types']) {
            assert.deepEqual(manifest[field], taggedManifest[field], 'Published ' + field + ' must match tagged source');
          }
          const files = execFileSync('tar', ['-tf', archive], { encoding: 'utf8' }).trim().split(/\r?\n/);
          assert.equal(new Set(files).size, files.length, 'Archive entries must be unique');
          const targets = value => typeof value === 'string' ? [value]
            : value && typeof value === 'object' ? Object.values(value).flatMap(targets) : [];
          const required = [
            ...targets(manifest.main), ...targets(manifest.bin), ...targets(manifest.exports), ...targets(manifest.types),
            ...['session', 'nativeWorker', 'ownedProcess', 'driver', 'runtimeFingerprint', 'produce', 'runProducer', 'spawn']
              .map(name => 'dist/results/' + name + '.js'),
            ...['ApplyDriver.class', 'ApplyDriver.java', 'ApplyWorker.class', 'ApplyWorker.java', 'ApplyDriver.build.json', 'windows-owned-process.ps1']
              .map(name => 'dist/results/driver/' + name),
            'dist/cli/run-mcp-server.js',
            'dist/authoring-kit/index.js', 'dist/flag-change-summary.schema.json',
            'dist/cql-emitter/catalog/CRLCommon.cql', 'dist/cql-emitter/catalog/CaseFeatureCommon.cql',
            'dist/cql-emitter/catalog/FHIRHelpers.cql',
          ];
          for (const target of required) {
            const relative = target.replace(/^\.\//, '');
            assert(files.includes('package/' + relative), 'Required package payload: ' + relative);
          }
          console.log(`Verified ${asset} ${entries[0][1]}`);
          NODE
          printf 'SDK_PATH=%s\n' "$SDK_DIR/$SDK_ASSET" >> "$GITHUB_ENV"
      - name: Publish to npm
        run: npm publish "$SDK_PATH" --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
