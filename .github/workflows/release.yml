# This workflow validates releases by running tests. If tests fail, the workflow fails and no further automation is run.
name: Validate Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  test-release:
    name: Run Tests Before Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test 