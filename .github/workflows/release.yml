# This workflow validates releases by running tests. If tests fail, the workflow fails and no further automation is run.
name: Validate Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  test-release:
    name: Run Tests Before Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests (crl only)
        run: npm test --workspace=@smile-digital-health/crl

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test-release
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft && !github.event.release.prerelease
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: npm ci
      - name: Build (crl only)
        run: npm run build --workspace=@smile-digital-health/crl
      - name: Pack and verify
        run: |
          cd packages/crl
          npm pack --dry-run
          echo "Verifying package contents..."
          npm pack
          PACKAGE_FILE=$(ls *.tgz)
          tar -ztvf $PACKAGE_FILE
          echo "Package contents verified."
      - name: Publish to npm
        run: cd packages/crl && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 