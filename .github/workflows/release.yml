name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # Only runs if tests pass
      - name: Publish (placeholder)
        if: success()
        run: echo "Publishing release... (replace with your publish command)" 